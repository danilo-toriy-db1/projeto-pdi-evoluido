<section id="apresentacao">
    <div class="apresentacao__container">
        <div class="apresentacao__img">
            <img src="./assets/img/logo.jpg" id="img-logo" alt="Imagem do logo MLP">
            <h1 class="apresentacao__title">My Landing Page</h1>
        </div>
        <h3 class="apresentacao__subtitle">Painel Administrativo</h3>
        <div class="apresentacao__text">    
            <h3 class="apresentacao__welcome-text">Bem-vindo ao Painel Administrativo <br></h3>
            <p class="apresentacao__initial-text">
                Aqui você pode revisar os dados e alterar as informações apresentadas na Landing Page! <br>
                Sinta-se livre para alterar suas informações pessoais ou habilidades. <br>
            </p>
        </div>    
    </div>
</section>

<app-card-initial-page [admin]="true" (click)="mudarPagina($event.target)"/>
