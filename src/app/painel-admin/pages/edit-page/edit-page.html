<app-card-about-me [modoEdicao]= "true" />

<section class="habilities__list">
    <ul class="card__container">
        @for (habilities of habilitiesDataService.habilities(); track habilities.id) {
            <li class="card" [id]="habilities.id" (click)="abrirModal(habilities)">
                <h3> {{ habilities.habilidade.habilidade }} </h3>
                <span class="type"> {{ habilities.habilidade.tipo }} </span>
                <!-- <app-button-exclude-hability /> -->
            </li>
        }
        <li class="card" (click)="abrirModalAdicionar()">
            <img src="assets/icons/black-add-icon.svg" alt="Ícone de adição de habilidades">
        </li>
    </ul>
</section>

<app-edit-modal [dadoRecebido]="cardData()" [grupoCard]="'habilidade'" />
