<header id="cabecalho">
    <nav id="navbar">
        <div class="menu__container">
            <span>Fechar Menu</span>
            <a id="navbar__menu"></a>
        </div>
        @for (anchor of dadosHeader; track $index) {
            <a [id]="anchor.id"
               (click)="trocarPagina(anchor.name)">
                {{ anchor.content }}
            </a>
        }
    </nav>    

    <div id="button__container" class="tooltip__theme">
        <button id="themeButton">
            <img src="/assets/icons/dark-mode.svg" 
            alt="Ícone do modo atual da página" id="img-theme">
        </button>
    </div>
</header>
