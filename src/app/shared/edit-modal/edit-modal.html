<dialog #editModal class="edit__modal">
    <div class="close__container">
        <button id="close__button" (click)="fecharModal()">
            <img src="/assets/icons/close-icon.svg" alt="Ícone do botão de fechar">
        </button>
    </div>

    <form [formGroup]="editForm" 
    (ngSubmit)="adicionaHabilidade() 
                    ? adicionarHabilidade()
                    : enviarDados()">
        <label for="input__texto"> 
            {{ grupoCard() === 'dados' 
                    ? 'Dados: '
                    : 'Habilidade: ' }}
        </label>
        <input type="text" formControlName="campoTexto" id="input__texto">

        @if (editForm.contains('tipo')) {
            <label for="select__tipo" id="label__select">
                Selecione o Tipo da Habilidade:
            </label>
            <select formControlName="tipo" id="select__tipo">
                <option value="" disabled>Selecione um tipo...</option>
                <option value="soft">Soft-Skill</option>
                <option value="hard">Hard-Skill</option>
            </select>
        }

        <div class="btn__container">
            <button class="btn__submit" type="submit">Salvar Alterações</button>
            <button class="btn__reset" (click)="fecharModal()">Cancelar</button>
        </div>

    </form>
</dialog>
