<h2>Acessar Conta</h2>

<form [formGroup]="loginForm" class="login__form">
	<input type="text" formControlName="email" id="input__email" placeholder="Digite seu email...">
	<input type="password" formControlName="senha" id="input__password" placeholder="Digite sua senha...">

	<button class="btn__login" type="submit">Entrar</button>
</form>
